<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pak QR Print — QR Poster (A4)</title>
<link rel="stylesheet" href="styles.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="qr.js"></script>
</head>
<body>
<div class="wrap no-print" style="text-align:center">
  <button class="btn" type="button" onclick="window.print()" style="max-width:280px;margin:14px auto">Print Poster (A4)</button>
  <p class="hint" id="posterMsg"></p>
</div>

<div class="poster">
  <div style="font-size:15px;font-weight:800;color:#4f46e5;letter-spacing:2px">PAK QR PRINT</div>
  <h2 id="posterShop">Pak QR Print</h2>
  <div style="font-size:15px">Print karwana hai? QR scan karein!</div>
  <canvas id="qrCanvas" width="240" height="240" style="margin:14px auto;display:block"></canvas>
  <div style="font-weight:800;font-size:17px">SCAN QR TO UPLOAD</div>
  <div style="font-size:13.5px;color:#5b5f8a;margin-top:4px">PDF • JPG • PNG • Word • Excel • PowerPoint</div>
  <div style="font-size:13.5px;color:#5b5f8a">Multiple Files • Free to Use</div>
  <div class="steps" style="grid-template-columns:repeat(3,1fr);margin-top:16px">
    <div><b>1</b>QR Scan Karein</div>
    <div><b>2</b>File Upload Karein</div>
    <div><b>3</b>Counter Se Print Lein</div>
  </div>
  <div id="posterUrl" style="font-size:12px;color:#5b5f8a;margin-top:14px;word-break:break-all"></div>
  <div class="hint" id="qrNote" style="margin-top:6px"></div>
  <div style="font-size:12px;color:#5b5f8a;margin-top:14px">Software developed by Sohail Abbas Marwat</div>
</div>

<script>
(function () {
  var cfg = window.PAKQR_FIREBASE_CONFIG || {};
  var ok = cfg.apiKey && cfg.apiKey.indexOf('YAHAN-') !== 0 && cfg.databaseURL && cfg.databaseURL.indexOf('YAHAN-') !== 0;
  var shopId = 'pakqrprint';
  try {
    var m = /[?&]shop=([A-Za-z0-9_-]+)/.exec(location.search);
    if (m) shopId = m[1];
    else if (window.PAKQR_SHOP_ID) shopId = window.PAKQR_SHOP_ID;
  } catch (e) {}
  var url = '';
  if (window.PAKQR_CUSTOMER_URL) url = window.PAKQR_CUSTOMER_URL.replace(/\/$/, '') + '/index.html?shop=' + shopId;
  else url = location.origin + location.pathname.replace(/[^\/]*$/, '') + 'index.html?shop=' + shopId;
  document.getElementById('posterUrl').textContent = url;
  var done = false;
  try { done = drawQRToCanvas(document.getElementById('qrCanvas'), url); } catch (e) { done = false; }
  document.getElementById('qrNote').textContent = done ? 'QR tayyar hai — phone camera se scan karke test kar lein.' : 'QR nahi ban saka — link bahut lamba hai ya customer URL theek nahi hai.';
  if (!ok) {
    document.getElementById('posterMsg').textContent = 'Note: firebase-config.js abhi bhari nahi gayi — dukaan ka naam default dikh raha hai. Hidayat ke mutabiq config bharein to naam khud aa jayega.';
  } else {
    try {
      firebase.initializeApp(cfg);
      firebase.database().ref('shops/' + shopId + '/settings/shopName').once('value').then(function (snap) {
        if (snap.val()) {
          document.getElementById('posterShop').textContent = snap.val();
        }
      });
    } catch (e) {}
  }
})();
</script>
</body>
</html>
